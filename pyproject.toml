[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suu-scrape"
version = "0.1.0"
description = "A modular scraper system for Students' Union UCL data."
authors = [
    {name = "MaybeItsAdam"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "beautifulsoup4",
    "python-dotenv",
    "supabase",
    "cuid",
    "click",
    "selenium"
]

[project.scripts]
suu-scrape = "suu_scrape.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["suu_scrape*"]
